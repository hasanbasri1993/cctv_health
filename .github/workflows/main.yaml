name: CI/CD Laravel Vue.js

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for frontend changes
        id: check-frontend
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="$BEFORE..$AFTER"
          fi
          if git diff --name-only "$RANGE" | grep -qE '^(resources/|package\.json|vite\.config)'; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.check-frontend.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        if: steps.check-frontend.outputs.has_changes == 'true'
        run: npm ci

      - name: Build frontend assets
        if: steps.check-frontend.outputs.has_changes == 'true'
        run: npm run build

      - name: Deploy PHP to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /www/wwwroot/cctv
            git config --global --add safe.directory /www/wwwroot/cctv
            git fetch origin main
            git reset --hard origin/main
            /www/server/php/82/bin/php /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction
            /www/server/php/82/bin/php artisan optimize
            /www/server/php/82/bin/php artisan migrate --force
            /www/server/php/82/bin/php artisan octane:reload
            /www/server/php/82/bin/php artisan queue:restart
            sudo chmod -R 775 storage bootstrap/cache
            sudo chown -R www:www storage bootstrap/cache

      - name: Transfer frontend build
        if: steps.check-frontend.outputs.has_changes == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          source: public/build/*
          target: /www/wwwroot/cctv

      - name: Purge Cloudflare cache
        if: steps.check-frontend.outputs.has_changes == 'true'
        run: |
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_KEY }}" \
            --data '{"hosts":["cctv.daarululuumlido.com"]}'

      - name: Notify Telegram
        uses: Lukasss93/telegram-action@v2
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        with:
          status: ${{ job.status }}
